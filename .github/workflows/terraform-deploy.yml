name: Terraform dev deployment

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed plan after it is displayed in this run"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and optionally apply dev
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce WIF main-branch restriction
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::GCP deployment is allowed only from refs/heads/main."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive terraform

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify the remote state bucket exists and is accessible
        working-directory: terraform/environments/dev
        shell: bash
        run: |
          backend_config="backend.hcl"
          bucket=""
          bucket_re='^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"([^"]*)"[[:space:]]*(#.*)?$'

          if [[ ! -f "$backend_config" ]]; then
            echo "::error::terraform/environments/dev/backend.hcl was not found."
            exit 1
          fi

          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" =~ $bucket_re ]]; then
              bucket="${BASH_REMATCH[1]}"
              break
            fi
          done < "$backend_config"

          if [[ -z "$bucket" ]]; then
            echo "::error::terraform/environments/dev/backend.hcl must specify the GCS state bucket."
            exit 1
          fi

          echo "Checking GCS state bucket: ${bucket}"

          set +e
          bucket_check="$(gcloud storage buckets describe "gs://${bucket}" --format="value(name)" 2>&1)"
          bucket_check_status=$?
          set -e

          if [ "$bucket_check_status" -ne 0 ]; then
            printf '%s\n' "$bucket_check" >&2
            if grep -Eiq '403|forbidden|permission denied|storage\.buckets\.get' <<< "$bucket_check"; then
              echo "::error::WIF authentication succeeded, but the service account cannot read metadata for gs://${bucket}. Grant bucket-scoped storage.buckets.get access and state/lock object access."
            elif grep -Eiq '404|not found|does not exist' <<< "$bucket_check"; then
              echo "::error::GCS state bucket gs://${bucket} was not found. Verify the bucket name and complete bootstrap before deploying."
            else
              echo "::error::Could not verify gs://${bucket}. Review the gcloud diagnostic above and check bucket existence and service-account access."
            fi
            exit 1
          fi

          if [ "$bucket_check" != "$bucket" ]; then
            echo "::error::gcloud returned an unexpected bucket name while checking gs://${bucket}."
            exit 1
          fi

      - name: Initialize the GCS backend
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.hcl

      - name: Validate configuration
        run: terraform validate

      - name: Create Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Display Terraform plan
        run: terraform show -no-color tfplan

      - name: Apply the displayed plan
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Remove local plan file
        if: always()
        run: rm -f tfplan 