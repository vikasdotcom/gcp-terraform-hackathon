name: Terraform dev destroy

on:
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy dev after the plan is displayed and state is backed up"
        required: true
        type: boolean
        default: false
      confirmation:
        description: 'When destroy is true, type exactly "destroy-dev"'
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  destroy:
    name: Plan and optionally destroy dev
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce WIF main-branch restriction
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Terraform destroy is allowed only from refs/heads/main."
            exit 1
          fi

      - name: Require explicit destroy confirmation
        if: inputs.destroy
        env:
          DESTROY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$DESTROY_CONFIRMATION" != "destroy-dev" ]; then
            echo "::error::Set confirmation to exactly destroy-dev to authorize destroying the dev environment."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive terraform

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Read the GCS state bucket from backend.hcl
        id: backend
        shell: bash
        run: |
          backend_config="backend.hcl"
          bucket=""
          bucket_re='^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"([^"]*)"[[:space:]]*(#.*)?$'

          if [[ ! -f "$backend_config" ]]; then
            echo "::error::terraform/environments/dev/backend.hcl was not found."
            exit 1
          fi

          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" =~ $bucket_re ]]; then
              bucket="${BASH_REMATCH[1]}"
              break
            fi
          done < "$backend_config"

          if [[ -z "$bucket" ]]; then
            echo "::error::terraform/environments/dev/backend.hcl must specify the GCS state bucket."
            exit 1
          fi

          echo "Checking GCS state bucket: ${bucket}"
          echo "name=${bucket}" >> "$GITHUB_OUTPUT"

      - name: Verify the GCS state bucket is accessible
        env:
          STATE_BUCKET: ${{ steps.backend.outputs.name }}
        shell: bash
        run: |
          set +e
          bucket_check="$(gcloud storage buckets describe "gs://${STATE_BUCKET}" --format="value(name)" 2>&1)"
          bucket_check_status=$?
          set -e

          if [ "$bucket_check_status" -ne 0 ]; then
            printf '%s\n' "$bucket_check" >&2
            echo "::error::The GCS backend bucket is missing or inaccessible. Resolve bucket access before running destroy."
            exit 1
          fi

          if [ "$bucket_check" != "$STATE_BUCKET" ]; then
            echo "::error::gcloud returned an unexpected bucket name while checking gs://${STATE_BUCKET}."
            exit 1
          fi

      - name: Initialize the GCS backend
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.hcl

      - name: Validate configuration
        run: terraform validate

      - name: Create Terraform destroy plan
        run: terraform plan -destroy -input=false -lock-timeout=5m -out=destroy.tfplan

      - name: Display Terraform destroy plan
        run: terraform show -no-color destroy.tfplan

      - name: Back up Terraform state before destroy
        if: inputs.destroy
        env:
          STATE_BUCKET: ${{ steps.backend.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          state_file="${RUNNER_TEMP}/dev-state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfstate"
          backup_uri="gs://${STATE_BUCKET}/terraform/state-backups/dev/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tfstate"
          trap 'rm -f "$state_file"' EXIT

          terraform state pull > "$state_file"
          gcloud storage cp "$state_file" "$backup_uri"
          echo "Pre-destroy state snapshot saved to ${backup_uri}"

      - name: Apply the destroy plan
        if: inputs.destroy
        run: terraform apply -input=false -lock-timeout=5m destroy.tfplan

      - name: Remove local destroy plan
        if: always()
        run: rm -f destroy.tfplan
 