name: Terraform bootstrap verification

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the read-only verification plan (creates no resources)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-bootstrap
  cancel-in-progress: false

jobs:
  verify:
    name: Verify existing state bucket
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    defaults:
      run:
        working-directory: terraform/bootstrap

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enforce WIF main-branch restriction
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Bootstrap verification is allowed only from refs/heads/main."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        working-directory: .
        run: terraform fmt -check -recursive terraform

      - name: Initialize with local state
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform validate

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Create Terraform plan
        run: terraform plan -input=false -lock=false -out=tfplan

      - name: Display Terraform plan
        run: terraform show -no-color tfplan

      - name: Apply the read-only verification plan
        if: inputs.apply
        run: terraform apply -input=false tfplan

      - name: Remove local plan file
        if: always()
        run: rm -f tfplan
         